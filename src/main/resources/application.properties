
# ==========================================
# SERVEUR
# ==========================================
server.port=8080
document.storage.path=./uploads

#
#spring.datasource.url=jdbc:mysql://localhost:3306/transfert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Kinshasa
#spring.datasource.username=root
#spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
#
#
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update
#
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# THYMELEAF (vues MVC)
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false  
spring.thymeleaf.check-template-location=true

# ==========================================
# SPRING SECURITY
# ==========================================
# (aucune propriété obligatoire, mais on peut logger)
logging.level.org.springframework.security=DEBUG

# ==========================================
# JWT (pour l'API optionnelle)
# ==========================================
jwt.secret=0123456789012345678901234567890123456789012345678901234567890123  # au moins 64 caractères pour HS512
jwt.expirationMs=3600000
jwt.refreshExpirationMs=86400000
# ==========================================
# LOGGING
# ==========================================
logging.level.com.transfert=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Indispensable pour que Swagger UI fonctionne derrière NGINX
server.forward-headers-strategy=framework

# Exposer les endpoints de santé et Prometheus
management.endpoints.web.exposure.include=health,info,prometheus

# Ajouter le nom de ton application pour la filtrer dans Grafana
spring.application.name=gestion-transfert-etudiant

# Configuration SMTP (exemple avec Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre-email@gmail.com
spring.mail.password=votre-mot-de-passe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optionnel : désactiver la validation du certificat pour le développement
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
