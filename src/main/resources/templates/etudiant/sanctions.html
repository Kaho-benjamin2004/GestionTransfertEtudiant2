<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Mes sanctions</title>...</head>
<body>
<div class="flex h-screen overflow-hidden">
    <aside>...</aside>
    <div class="flex-grow flex flex-col overflow-hidden">
        <header>...</header>
        <main class="flex-grow p-8 overflow-y-auto">
            <div class="content-card p-6">
                <h2 class="text-xl font-bold mb-4">Sanctions</h2>
                <div th:if="${sanctions == null or sanctions.empty}" class="bg-green-50 text-green-600 p-4 rounded">Aucune sanction.</div>
                <div th:unless="${sanctions == null or sanctions.empty}" class="space-y-3">
                    <div th:each="s : ${sanctions}" class="border-l-4 border-red-500 bg-white p-4 rounded shadow-sm">
                        <p class="font-bold" th:text="${s.description}">-</p>
                        <p class="text-sm">Date : <span th:text="${#dates.format(s.date, 'dd/MM/yyyy')}">-</span></p>
                        <p class="text-sm">Gravité : <span th:class="${s.gravite == 'Exclusion' ? 'text-red-600' : 'text-orange-500'}" th:text="${s.gravite}">-</span></p>
                        <p th:if="${s.duree != null}" class="text-sm">Durée : <span th:text="${s.duree}">0</span> jour(s)</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
