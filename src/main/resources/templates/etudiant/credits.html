<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes crédits - Université de l'Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { univ: { navy: '#133054', gold: '#bfa15f' } } } } }</script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; } .bg-campus-blur { background-image: linear-gradient(rgba(19,48,84,0.4), rgba(15,23,42,0.45)), url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1470&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; } .content-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(2px); border-radius: 1.5rem; }</style>
</head>
<body class="bg-campus-blur min-h-screen">
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar identique -->
    <aside class="w-72 bg-univ-navy text-white flex flex-col justify-between shadow-2xl z-30 flex-shrink-0 border-r border-univ-gold/20">
        <div>...</div> <!-- Même sidebar que ci-dessus -->
    </aside>
    <div class="flex-grow flex flex-col overflow-hidden">
        <header class="h-20 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-8">
            <div><h1 class="text-2xl font-bold text-univ-navy">Mes crédits ECTS</h1></div>
            <div class="flex items-center space-x-3"><div class="text-right"><span class="block text-sm font-bold text-univ-navy" th:text="${etudiant != null ? etudiant.nom + ' ' + etudiant.prenom : 'Étudiant'}">Étudiant</span><span class="block text-[11px] text-slate-500">N° <span th:text="${etudiant.numeroEtudiant}">123456</span></span></div><img src="https://ui-avatars.com/api/?background=133054&color=bfa15f&bold=true&name=Student" class="w-10 h-10 rounded-full border-2 border-univ-gold"></div>
        </header>
        <main class="flex-grow p-8 overflow-y-auto">
            <div class="content-card p-6">
                <h2 class="text-xl font-bold mb-4">Crédits acquis</h2>
                <div th:if="${credits == null or credits.empty}" class="bg-blue-50 text-blue-600 p-4 rounded">Aucun crédit enregistré.</div>
                <div th:unless="${credits == null or credits.empty}" class="overflow-x-auto">
                    <table class="min-w-full border">
                        <thead class="bg-univ-navy text-white"><tr><th class="p-3">Année</th><th>Crédits</th><th>Statut</th></tr></thead>
                        <tbody>
                        <tr th:each="c : ${credits}" class="border-b hover:bg-slate-50">
                            <td class="p-3" th:text="${c.annee}">-</td>
                            <td class="p-3" th:text="${c.nombre}">0</td>
                            <td class="p-3"><span th:if="${c.statut == 'Acquis'}" class="text-green-600">Acquis</span><span th:unless="${c.statut == 'Acquis'}" th:text="${c.statut}">-</span></td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="mt-4 p-3 bg-univ-navy/10 rounded"><strong>Total acquis :</strong> <span th:text="${#aggregates.sum(credits.![nombre])}">0</span> ECTS</div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
