<!DOCTYPE html>
<div th:replace="~{{../layouts/base :: content}}">
    <div th:fragment="pageContent">
        <section class="content-card p-6">
            <h2 class="text-2xl font-bold text-univ-navy mb-4">Admin / Fraude / Anomalies / Liste</h2>
            <p class="text-slate-600 mb-6">Liste dynamique depuis le backend avec le même design global.</p>
            <div class="overflow-x-auto">
                <table class="min-w-full border border-slate-200 rounded-xl">
                    <thead class="bg-univ-navy text-white"><tr><th class="p-3">Entité</th><th class="p-3">Statut</th><th class="p-3">Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${{items}}" class="border-b border-slate-100 hover:bg-slate-50 transition">
                            <td class="p-3" th:text="${{item.nom ?: item.login ?: item.titre ?: item.reference}}">Champ</td>
                            <td class="p-3" th:text="${{item.statut ?: item.actif ?: item.date}}">Statut</td>
                            <td class="p-3 text-right"><span class="text-univ-navy font-semibold">Voir / Éditer</span></td>
                        </tr>
                        <tr th:if="${{items == null or #lists.isEmpty(items)}}"><td colspan="3" class="p-3 text-center text-slate-400">Aucune donnée à afficher.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
