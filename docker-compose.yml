services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: db_name
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: springboot_app
    restart: on-failure
    depends_on:
      - db

    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/db_name?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=db_user
      - SPRING_DATASOURCE_PASSWORD=db_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    # La ligne "ports" a été supprimée ici pour sécuriser l'application

  nginx:
    image: nginx:latest
    container_name: nginx_proxy_GestionTransfertEtudiant
    restart: always
    ports:
      - "80:80" # On expose uniquement le port 80 de NGINX vers l'extérieur
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      restart: always
      ports:
        - "9090:9090" # Interface web de Prometheus (optionnel, pour debug)
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
        image: grafana/grafana:latest
        container_name: grafana
        restart: always
        ports:
          - "3000:3000" # C'est ici que tu iras voir tes tableaux de bord
        depends_on:
          - prometheus

volumes:
  mysql_data: